<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RemoveAndroidAI — up to 7 GB back</title>
  <desc id="desc">Turn off on-device AI. Get your storage back. Plug in your Android phone. One click. Every step can be undone.</desc>
  <rect width="1280" height="640" fill="#142B32"/>
  <g transform="translate(64 56) scale(.21875)">
    <rect width="512" height="512" rx="112" fill="#203D45"/>
    <rect x="144" y="80" width="224" height="352" rx="48" fill="none" stroke="#F5FAF8" stroke-width="32"/>
    <rect x="96" y="208" width="320" height="144" rx="72" fill="#203D45"/>
    <rect x="112" y="224" width="288" height="112" rx="56" fill="#83D9C3"/>
    <circle cx="168" cy="280" r="40" fill="#142B32"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="204" y="130" font-size="60" font-weight="700" letter-spacing="-2" fill="#F5FAF8">RemoveAndroidAI</text>
    <text x="64" y="229" font-size="32" fill="#B2C7CA">Turn off on-device AI. Get your storage back.</text>
    <text x="68" y="300" font-size="28" fill="#83D9C3">Up to</text>
    <text x="60" y="446" font-size="160" font-weight="700" letter-spacing="-6" fill="#83D9C3">7 GB back</text>
    <text x="68" y="513" font-size="28" fill="#F5FAF8">Plug in your phone. One click. Room to breathe.</text>
    <text x="68" y="574" font-size="26" fill="#B2C7CA">Open source. Every step can be undone.</text>
  </g>
</svg>
