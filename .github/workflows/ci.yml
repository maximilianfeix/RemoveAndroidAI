name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: README package table is current
        run: node scripts/readme-table.mjs --check
      - name: Web build uses relative asset URLs (Pages serves it from a subpath)
        run: "! grep -E '(src|href)=\"/' dist/web/index.html"
      - name: Committed CLI bundle is current
        run: git diff --exit-code -- dist/cli.mjs
